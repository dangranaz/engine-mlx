[workspace]
resolver = "2"
members = [
    "crates/ops",
    "crates/mlx-ffi",
    "crates/attention",
    "crates/prefill",
    "crates/kvcache",
    "crates/serve",
    "crates/modelplan",
    "crates/tokenizer",
]
exclude = [
    "crates/ops/crates",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dangranaz/engine-mlx"

[workspace.dependencies]
# Internal crates
engine-mlx-ops = { path = "crates/ops" }
engine-mlx-ffi = { path = "crates/mlx-ffi" }
engine-mlx-attention = { path = "crates/attention" }
engine-mlx-prefill = { path = "crates/prefill" }
engine-mlx-kvcache = { path = "crates/kvcache" }

# Vendored crates (model introspection + pure-Rust tokenizer)
nxm-modelplan = { path = "crates/modelplan" }
nxm-tokenizer = { path = "crates/tokenizer" }

# MLX-C FFI (requires mlx-c headers at build time)
mlx-sys = { version = "0.2" }

# Common
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "2"
half = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
safetensors = "0.8"
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tokenizers = "0.23"
sha1 = "0.10"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1